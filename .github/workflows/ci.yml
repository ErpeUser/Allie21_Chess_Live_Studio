name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: allie21-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ALLIE_REQUIRE_BROWSER_TESTS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: '0.13.7'

      - name: Install locked runtime and test dependencies
        run: uv sync --frozen --extra quality

      - name: Install browser for integration tests
        shell: pwsh
        run: |
          uv run --frozen python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify vendored Allie model manifest
        shell: pwsh
        run: |
          uv run --frozen python -c "import sys; sys.path.insert(0, 'backend'); from allie_local_server import verify_vendor_integrity; verify_vendor_integrity()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Run Python unittest suite
        run: uv run --frozen python -m unittest discover --start-directory tests --pattern 'test_*.py'

      - name: Run Python pytest and real DOM browser suite
        run: uv run --frozen pytest -q

      - name: Ruff
        shell: pwsh
        run: |
          uv run --frozen ruff check backend tools tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mypy
        shell: pwsh
        run: |
          uv run --frozen mypy backend --ignore-missing-imports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compileall
        shell: pwsh
        run: |
          uv run --frozen python -m compileall -q backend tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check tracked JavaScript syntax
        shell: pwsh
        run: |
          $files = @(git ls-files -- '*.js')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $files.Count) { throw 'No JavaScript files found.' }
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run JavaScript tests
        run: node --test tests/*.js

      - name: Verify release versions stay aligned
        shell: pwsh
        run: |
          $project = [regex]::Match((Get-Content pyproject.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"\r?$').Groups[1].Value
          $manifest = Get-Content browser/manifest.json -Raw | ConvertFrom-Json
          $userscript = [regex]::Match((Get-Content browser/allie21_overlay.user.js -Raw), '@version\s+([^\r\n]+)').Groups[1].Value.Trim()
          if (-not $project -or $manifest.version_name -ne $project -or $userscript -ne $project) {
            throw "Version drift: project=$project manifest=$($manifest.version_name) userscript=$userscript"
          }
