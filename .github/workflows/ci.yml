name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.7'

      - name: Install locked runtime and test dependencies
        run: uv sync --frozen --extra quality

      - name: Run Python unittest suite
        run: uv run python -m unittest discover --start-directory tests --pattern 'test_*.py'

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.js' |
            Where-Object { $_.FullName -notmatch '[\\/]node_modules[\\/]' }
          if (-not $files) { throw 'No JavaScript files found.' }
          foreach ($file in $files) { node --check $file.FullName }
