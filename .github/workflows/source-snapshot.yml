name: Source snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=source.zip HEAD
          git rev-parse HEAD > source-commit.txt
          sha256sum source.zip > source.sha256
      - name: Store private diagnostic snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-${{ github.sha }}
          path: |
            source.zip
            source-commit.txt
            source.sha256
          retention-days: 1
          if-no-files-found: error
