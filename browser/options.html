<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allie 2.1 Verbindung</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;max-width:36rem;margin:2rem auto;padding:0 1rem;color:#24170f}
label{display:block;font-weight:700;margin:1rem 0 .3rem}input{width:9rem;padding:.5rem}
button,a{display:inline-block;margin:.8rem .5rem 0 0;padding:.6rem .8rem}#status{min-height:3em}
#status[data-kind=error]{color:#b42318}#status[data-kind=good]{color:#276749}
button:disabled{opacity:.6}small{display:block;color:#555}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #276749;outline-offset:3px}
</style>
<script src="connection.js" defer></script>
<script src="options.js" defer></script>
</head>
<body>
<h1>Allie 2.1 Verbindung</h1>
<p>Stelle hier denselben lokalen Port wie im Launcher (<code>ALLIE_PORT</code>) ein.</p>
<label for="port">Lokaler Port</label>
<input id="port" type="number" min="1024" max="65535" step="1" inputmode="numeric" aria-describedby="portHint">
<small id="portHint">Standard: 8765. Erlaubt: 1024 bis 65535. Danach Schach-Tabs neu laden.</small>
<button id="save" type="button">Speichern</button>
<button id="test" type="button">Verbindung testen</button>
<a id="viewer" href="http://127.0.0.1:8765/viewer" target="_blank" rel="noopener noreferrer">Viewer oeffnen</a>
<p id="status" role="status" aria-live="polite"></p>
</body>
</html>
