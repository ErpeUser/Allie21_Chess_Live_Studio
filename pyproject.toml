[project]
name = "allie21-chess-live-studio"
version = "11.2.14"
description = "Local Windows chess video and browser analysis with Allie 2.1 and Stockfish"
requires-python = "==3.12.*"
dependencies = [
  "chess==1.11.2",
  "chess-tcn==1.0.1",
  "fastapi==0.162.2",
  "pillow==13.0.0",
  "pydantic==2.14.3",
  "torch==2.15.0",
  "transformers==5.22.2",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
vision = [
  "chessvision==0.13.1",
  "numpy==2.5.4",
  "onnxruntime==1.31.1",
  "rapidocr==3.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
